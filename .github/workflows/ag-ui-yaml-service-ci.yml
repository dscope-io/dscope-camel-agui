name: AG-UI YAML Service CI

on:
  push:
    paths:
      - "samples/ag-ui-yaml-service/**"
      - "camel-ag-ui-component/**"
      - "pom.xml"
      - "samples/pom.xml"
      - ".github/workflows/ag-ui-yaml-service-ci.yml"
  pull_request:
    paths:
      - "samples/ag-ui-yaml-service/**"
      - "camel-ag-ui-component/**"
      - "pom.xml"
      - "samples/pom.xml"
      - ".github/workflows/ag-ui-yaml-service-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned official AG-UI client
        run: npm ci --prefix tests/agui-client --ignore-scripts

      - name: Run default test suite (no UI E2E)
        run: mvn -B -ntp -Dagui.interop=true test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-unit-tests
          path: "**/target/surefire-reports/**"

  ui-e2e-tests:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and OS libraries
        run: npx --yes playwright@1.62.0 install --with-deps chromium

      - name: Run Playwright UI E2E suite
        env:
          CI: "true"
        run: mvn -B -ntp -pl samples/ag-ui-yaml-service -am -Pui-e2e test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-ui-e2e
          path: "**/target/surefire-reports/**"
